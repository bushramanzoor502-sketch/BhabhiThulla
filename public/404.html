<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bhabhi Thulla</title>
    <meta name="robots" content="noindex" />
    <script>
      // GitHub Pages SPA fallback (rafgraph/spa-github-pages): turn /BhabhiThulla/faqs into
      // /BhabhiThulla/?/faqs so index.html can boot the app and restore the real path.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body style="background:#0B2A22"></body>
</html>
